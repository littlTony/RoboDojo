# Tianji tabletop scene; other embodiments require changes to the stand and layout.
Replay_layout: False

Room:
  default: "Simple_Room_nolight"
  default_pos: [0.0, 0.0, 0.0]
  default_ori: [1.0, 0.0, 0.0, 0.0]
  scale: [0.5, 0.5, 0.9]

Table:
  default: material_0116
  scale: [1.6, 1.2, 0.05]
  default_pos: [0.0, -0.05, 0.74]
  default_ori: [1.0, 0.0, 0.0, 0.0]

Background:
  intensity: 1000
  default: "brown_photostudio_02_4k.hdr"

Ground:
  geometry: "cube"
  thickness: 0.1
  axis: "Z"
  default_pos: [0.0, 0.0, 0.0]
  materials:
    type: mdl
    default: material_0122
  physics_material:
    static_friction: 1.0
    dynamic_friction: 1.0
    restitution: 0.0
    friction_combine_mode: "multiply"
    restitution_combine_mode: "multiply"
    compliant_contact_stiffness: 0.0
    compliant_contact_damping: 0.0

Geometry:
  -
    common:
      xlim: [-0.0063, -0.0063]
      ylim: [-0.78, -0.78]
      zlim: [0.9918, 0.9918]
      qpos: [0.707, 0.0, 0.0, 0.707]
      rotate_rand: False
      relative_plane: "Ground"
      check_mode: "enforce"

    category:
      -
        name: "tianji_wujihand_stand"
        index: [0]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["tianji_wujihand_stand"]
