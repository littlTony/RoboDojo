Rigid:
  -
    common:
      xlim: [-0.20, 0.20]
      ylim: [-0.22, -0.08]
      rotate_rand: True
      rotate_deg: [-90, 90]
      relative_plane: "Table"
      place_tag: "up"
      margin: 0.01

    category:
      -
        name: "garage"
        index: [9]

    select_mode:
      nums: 1
      mode: "allow_duplicate"
      label: ["garage"]

  -
    common:
      xlim: [-0.45, 0.45]
