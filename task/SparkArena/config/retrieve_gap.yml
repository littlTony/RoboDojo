      relative_to:
        label: "garage"
        axis: "x"
        distance: [0.12, 0.12]
        align_ori: true

    category:
      -
        name: "cube"
        index: [7]

    select_mode:
      nums: 1
      mode: "allow_duplicate"
      label: ["cube_right"]

  -
    common:
      xlim: [-0.45, 0.45]
      ylim: [-0.30, 0.0]
      rotate_rand: false
      relative_plane: "Table"
      margin: 0.01
      relative_to:
        label: "garage"
        axis: "x"
        distance: [-0.12, -0.12]
        align_ori: true

    category:
      -
        name: "cube"
        index: [7]

    select_mode:
      nums: 1
      mode: "allow_duplicate"
      label: ["cube_left"]

  -
    common:
      xlim: [-0.20, 0.20]
