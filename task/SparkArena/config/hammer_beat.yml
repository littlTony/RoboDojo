Rigid:
  -
    common:
      xlim: [-0.05, 0.30]
      ylim: [-0.22, -0.08]
      rotate_rand: true
      rotate_deg: [60, 30]
      place_tag: "up"
      relative_plane: "Table"
      margin: 0.03

    category:
      -
        name: "hammer"
        index: [5, 6, 7]

    select_mode:
      nums: 1
      mode: "allow_duplicate"
      label: ["hammer"]

  -
    common:
      xlim: [-0.20, 0.20]
      ylim: [-0.22, -0.08]
      rotate_rand: False
      relative_plane: "Table"

    category:
      -
        name: "block"
        index: [5, 8, 11, 14, 17]
        group: "size0"

    select_mode:
      nums: 1
      mode: "allow_duplicate"
      label: ["cube"]
