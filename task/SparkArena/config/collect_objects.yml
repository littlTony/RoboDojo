Rigid:
  -
    common:
      xlim: [-0.05, 0.05]
      ylim: [-0.02, -0.02]
      rotate_rand: False
      relative_plane: "Table"
      margin: 0.02

    category:
      -
        name: "basket"
        index: [2]

    select_mode:
      nums: 1
      mode: "same"
      label: ["basket"]

  -
    common:
      xlim: [-0.45, 0.45]
      ylim: [-0.30, -0.05]
