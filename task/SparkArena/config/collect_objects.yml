      rotate_rand: True
      relative_plane: "Table"
      margin: 0.02

    category:
      -
        name: "alarm"
      -
        name: "bottle"
        index: [45, 46]
      -
        name: "flashlight"
      -
        name: "hand_wash"
      -
        name: "jam_jar"
      -
        name: "milk_box"
      -
        name: "oreo_cookie"
      -
        name: "scanner"
      -
        name: "shampoo"
      -
        name: "tea_box"
      -
        name: "tooth_paste_box"
      -
        name: "yogurt"
      -
        name: "garage"
        index: [1, 2, 14, 15]
      -
        name: "headset"
        index: [2, 3]
      -
        name: "toy_car"
        index: [0, 1, 2, 3, 4]
      -
        name: "action_camera"

    select_mode:
      nums: [3]
      mode: "unique"
      label: ["target0", "target1", "target2"]
